<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="심사 관리">
<title>심사평 — 관리자</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #F2F0E8;
  --surface: #FFFFFF;
  --surface2: #ECEAE0;
  --border: #DEDAD0;
  --border2: #C0BBAC;
  --text: #1C1A14;
  --text2: #6A6858;
  --text3: #A8A490;
  --accent: #1A48D0;
  --accent-dk: #1238A8;
  --accent-bg: #EAF0FF;
  --gold: #9A6C00;
  --gold-bg: #FFF8E0;
  --gold-border: #E8C96A;
  --green: #1A6E3C;
  --green-bg: #E8F5EE;
  --green-border: #9ECFB4;
  --red: #B82828;
  --font: 'Noto Sans KR', -apple-system, sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  overflow: hidden;
  position: fixed;
  -webkit-font-smoothing: antialiased;
}

#app { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; }

/* ════════════════════════════════
   SETUP
════════════════════════════════ */
#setup {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%; background: var(--bg);
}
.setup-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 24px; padding: 36px 32px 32px;
  width: 100%; max-width: 460px; margin: 24px;
  box-shadow: 0 4px 40px rgba(0,0,0,.06);
}
.setup-eyebrow { font-size: 12px; font-weight: 700; color: var(--gold); letter-spacing: 1px; margin-bottom: 18px; }
.setup-title { font-size: 26px; font-weight: 900; margin-bottom: 6px; }
.setup-sub { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 28px; }
.setup-go {
  width: 100%; padding: 15px; background: var(--accent); color: #fff;
  border: none; border-radius: 14px; font-size: 16px; font-weight: 900;
  cursor: pointer; font-family: var(--font); transition: all .15s;
}
.setup-go:active { background: var(--accent-dk); transform: scale(.98); }
.setup-go:disabled { background: var(--border2); color: var(--text3); cursor: default; transform: none; }
.setup-err { font-size: 13px; color: var(--red); font-weight: 600; margin-bottom: 14px; display: none; padding: 10px 14px; background: #FFF0F0; border-radius: 8px; }

/* ════════════════════════════════
   MAIN
════════════════════════════════ */
#main { display: none; flex-direction: column; width: 100%; height: 100%; }

/* HEADER */
.hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px; height: 56px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.hdr-logo { font-size: 15px; font-weight: 900; color: var(--gold); padding-right: 14px; border-right: 1px solid var(--border); }
.hdr-admin { font-size: 11px; font-weight: 800; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; }
.hdr-gap { flex: 1; }
.rt-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface2);
}
.rt-led { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); transition: all .4s; flex-shrink: 0; }
.rt-led.on { background: var(--green); box-shadow: 0 0 0 3px rgba(26,110,60,.18); }
.rt-txt { font-size: 12px; font-weight: 700; color: var(--text3); }
.prog-pill {
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 12px; font-weight: 800; color: var(--text2);
}
.prog-pill b { color: var(--accent); }

/* BODY */
.body { flex: 1; display: flex; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 230px; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sb-head { padding: 14px 12px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

.cur-card {
  background: var(--gold-bg); border: 1.5px solid var(--gold-border);
  border-radius: 16px; padding: 14px 16px;
}
.cur-label { font-size: 10px; font-weight: 800; color: #A08020; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 4px; }
.cur-num { font-size: 28px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; line-height: 1; }
.cur-name { font-size: 18px; font-weight: 800; color: #5A4000; margin-top: 3px; }

.nav-row { display: flex; gap: 8px; }
.nav-btn {
  flex: 1; padding: 11px 0; border-radius: 11px;
  border: 1.5px solid var(--border); background: var(--bg);
  font-size: 14px; font-weight: 900; color: var(--text2);
  cursor: pointer; transition: all .12s; font-family: var(--font);
  display: flex; align-items: center; justify-content: center; gap: 3px;
  user-select: none; -webkit-touch-callout: none;
}
.nav-btn.next { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1.6; }
.nav-btn:active { transform: scale(.95); }
.nav-btn:disabled { opacity: .35; cursor: default; transform: none; }

.sb-scroll { flex: 1; overflow-y: auto; padding: 6px 8px; -webkit-overflow-scrolling: touch; }
.sb-scroll::-webkit-scrollbar { width: 3px; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.st-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 10px; border-radius: 11px;
  cursor: pointer; transition: all .12s; margin-bottom: 2px;
  user-select: none; -webkit-touch-callout: none;
}
.st-row:hover { background: var(--surface2); }
.st-row.active { background: var(--gold-bg); }
.st-rn { font-size: 14px; font-weight: 900; color: var(--gold); min-width: 30px; font-variant-numeric: tabular-nums; }
.st-rm { font-size: 13px; font-weight: 700; color: var(--text); flex: 1; }
.dots { display: flex; gap: 3px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.dot.on { background: var(--green); }

/* ── PANEL ── */
.panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.panel-hdr {
  padding: 12px 18px 10px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  flex-wrap: wrap; row-gap: 6px;
}
.panel-title { font-size: 18px; font-weight: 900; }
.panel-title span { color: var(--gold); }

.status-row { display: flex; gap: 6px; flex-wrap: wrap; }
.pchip {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 12px; font-weight: 700; color: var(--text2);
  transition: all .2s;
}
.pchip.on { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.pchip-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: background .2s; }
.pchip.on .pchip-dot { background: var(--green); }

/* CARDS */
.cards {
  flex: 1; overflow-y: auto; padding: 14px;
  display: grid; grid-template-columns: repeat(2,1fr); gap: 12px;
  align-content: start; -webkit-overflow-scrolling: touch;
}
.cards::-webkit-scrollbar { width: 4px; }
.cards::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.pcard { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; transition: border-color .2s; }
.pcard.has-review { border-color: var(--green-border); }

.pcard-hdr {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 13px; background: var(--surface2); border-bottom: 1px solid var(--border);
}
.pavatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: #fff; flex-shrink: 0;
}
.pcard-nm { font-size: 13px; font-weight: 800; color: var(--text); flex: 1; }
.pcard-st { font-size: 11px; font-weight: 700; }
.pcard-st.done { color: var(--green); }
.pcard-st.none { color: var(--text3); }

.pcard-img { width: 100%; height: 160px; display: block; background: #FFFFFE; object-fit: cover; }
.pcard-empty {
  height: 160px; display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 6px; background: var(--bg);
}
.pe-icon { font-size: 24px; opacity: .2; }
.pe-txt { font-size: 12px; color: var(--text3); font-weight: 600; }

/* TOAST */
.toast {
  position: fixed; bottom: calc(env(safe-area-inset-bottom,0px)+24px);
  left: 50%; transform: translateX(-50%) translateY(14px);
  background: rgba(28,26,20,.93); color: #fff;
  padding: 12px 24px; border-radius: 24px;
  font-size: 14px; font-weight: 700; white-space: nowrap;
  opacity: 0; transition: opacity .22s, transform .22s;
  pointer-events: none; z-index: 200;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- SETUP -->
  <div id="setup">
    <div class="setup-card">
      <div class="setup-eyebrow">🎹 콩쿠르 심사평 시스템</div>
      <div class="setup-title">관리자 화면</div>
      <div class="setup-sub">교수 5명의 심사평을 실시간으로 확인하고<br>학생 진행을 제어합니다.</div>
      <div class="setup-err" id="setup-err"></div>
      <button class="setup-go" id="setup-go" onclick="launch()">관리자로 시작 →</button>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div class="hdr">
      <div class="hdr-logo">🎹 콩쿠르</div>
      <div class="hdr-admin">관리자</div>
      <div class="hdr-gap"></div>
      <div class="rt-pill">
        <div class="rt-led" id="rt-led"></div>
        <div class="rt-txt" id="rt-txt">연결 중</div>
      </div>
      <div class="prog-pill">완료 <b id="prog">0/0</b></div>
    </div>

    <div class="body">
      <div class="sidebar">
        <div class="sb-head">
          <div class="cur-card">
            <div class="cur-label">현재 진행</div>
            <div class="cur-num" id="cur-num">—</div>
            <div class="cur-name" id="cur-name">—</div>
          </div>
          <div class="nav-row">
            <button class="nav-btn" id="btn-prev" onclick="move(-1)">◀ 이전</button>
            <button class="nav-btn next" id="btn-next" onclick="move(1)">다음 ▶</button>
          </div>
        </div>
        <div class="sb-scroll" id="sb-list"></div>
      </div>

      <div class="panel">
        <div class="panel-hdr">
          <div class="panel-title"><span id="ptitle">—</span> 심사평</div>
          <div class="status-row" id="status-row"></div>
        </div>
        <div class="cards" id="cards"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SUPABASE ─────────────────────────────────────────────
const SB_URL = 'https://edtqvtmyzdlaeiodeuqu.supabase.co';
const SB_KEY = 'sb_publishable__D4PlkuTNYvfDJ55DixeOA_dnEWfqrv';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── STATE ────────────────────────────────────────────────
let students = [];
let curSnum = null;
let reviewMeta = {}; // "snum_pi" → true (존재 여부)

const PCOLORS = ['#1A48D0','#B82828','#1A6E3C','#7A3FB0','#C07010'];
const PNAMES  = ['교수 1','교수 2','교수 3','교수 4','교수 5'];

// ── SETUP ────────────────────────────────────────────────
async function launch() {
  const btn = document.getElementById('setup-go');
  btn.disabled = true; btn.textContent = '연결 중...';
  try {
    const { error } = await sb.from('students').select('num').limit(1);
    if (error) throw error;
    await initMain();
  } catch(e) {
    const el = document.getElementById('setup-err');
    el.textContent = '서버 연결 실패. 인터넷을 확인해주세요.';
    el.style.display = 'block';
    btn.disabled = false; btn.textContent = '관리자로 시작 →';
  }
}

// ── INIT ─────────────────────────────────────────────────
async function initMain() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('main').style.display = 'flex';

  const { data: st } = await sb.from('students').select('*').order('num');
  students = st || [];

  // 리뷰 메타 (이미지 제외)
  const { data: rv } = await sb.from('reviews').select('student_num,prof_index');
  if (rv) rv.forEach(r => reviewMeta[`${r.student_num}_${r.prof_index}`] = true);

  // 현재 학생
  const { data: cs } = await sb.from('current_state').select('student_num').eq('id',1).single();
  const init = cs?.student_num || students[0]?.num;
  if (init) await setStudent(init, false);

  subscribe();
  updateProgress();
}

// ── REALTIME ─────────────────────────────────────────────
function subscribe() {
  sb.channel('admin-ch')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reviews' }, async p => {
      if (p.eventType === 'DELETE') {
        delete reviewMeta[`${p.old.student_num}_${p.old.prof_index}`];
      } else if (p.new) {
        reviewMeta[`${p.new.student_num}_${p.new.prof_index}`] = true;
      }
      updateProgress();
      renderSidebar();
      if (p.new?.student_num === curSnum || p.old?.student_num === curSnum) {
        renderStatus(curSnum);
        await renderCards(curSnum);
      }
    })
    .subscribe(st => {
      const led = document.getElementById('rt-led');
      const txt = document.getElementById('rt-txt');
      if (st === 'SUBSCRIBED') { led.classList.add('on'); txt.textContent = '실시간'; }
      else { led.classList.remove('on'); txt.textContent = '연결 중'; }
    });
}

// ── NAVIGATION ───────────────────────────────────────────
async function move(dir) {
  const idx = students.findIndex(s => s.num === curSnum);
  const ni = idx + dir;
  if (ni < 0 || ni >= students.length) return;
  await setStudent(students[ni].num, true);
}

async function setStudent(num, updateDB) {
  curSnum = num;
  const s = students.find(x => x.num === num);
  if (!s) return;

  document.getElementById('cur-num').textContent = s.num + '번';
  document.getElementById('cur-name').textContent = s.name;
  document.getElementById('ptitle').textContent = `${s.num}번 ${s.name}`;

  const idx = students.findIndex(x => x.num === num);
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === students.length - 1;

  renderSidebar();
  renderStatus(num);
  await renderCards(num);

  if (updateDB) {
    await sb.from('current_state').update({ student_num: num, updated_at: new Date().toISOString() }).eq('id',1);
    toast(`→ ${s.num}번 ${s.name}으로 변경 완료`);
  }

  setTimeout(() => {
    const list = document.getElementById('sb-list');
    list.querySelector('.st-row.active')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 60);
}

// ── RENDER ───────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('sb-list');
  el.innerHTML = students.map(s => {
    const dots = PNAMES.map((_,pi) =>
      `<div class="dot${reviewMeta[`${s.num}_${pi}`]?' on':''}"></div>`
    ).join('');
    return `<div class="st-row${s.num===curSnum?' active':''}" onclick="setStudent(${s.num},false)">
      <span class="st-rn">${s.num}</span>
      <span class="st-rm">${s.name}</span>
      <div class="dots">${dots}</div>
    </div>`;
  }).join('');
}

function renderStatus(snum) {
  const el = document.getElementById('status-row');
  el.innerHTML = PNAMES.map((p,pi) => {
    const done = !!reviewMeta[`${snum}_${pi}`];
    return `<div class="pchip${done?' on':''}">
      <div class="pchip-dot"></div>${p}
    </div>`;
  }).join('');
}

async function renderCards(snum) {
  const el = document.getElementById('cards');
  // 스켈레톤 먼저
  el.innerHTML = PNAMES.map((p,pi) => {
    const has = !!reviewMeta[`${snum}_${pi}`];
    return `<div class="pcard${has?' has-review':''}" id="card-${pi}">
      <div class="pcard-hdr">
        <div class="pavatar" style="background:${PCOLORS[pi]}">${pi+1}</div>
        <div class="pcard-nm">${p}</div>
        <span class="pcard-st${has?' done':' none'}">${has?'저장됨 ✓':'미작성'}</span>
      </div>
      ${has
        ? `<canvas class="pcard-img" id="pc-${pi}" height="160"></canvas>`
        : `<div class="pcard-empty"><div class="pe-icon">✍️</div><div class="pe-txt">아직 심사평 없음</div></div>`
      }
    </div>`;
  }).join('');

  // 이미지 비동기 로드
  for (let pi = 0; pi < 5; pi++) {
    if (!reviewMeta[`${snum}_${pi}`]) continue;
    loadCardImage(snum, pi);
  }
}

async function loadCardImage(snum, pi) {
  const { data } = await sb.from('reviews')
    .select('image_data').eq('student_num', snum).eq('prof_index', pi).single();
  if (!data?.image_data) return;
  const c = document.getElementById(`pc-${pi}`);
  if (!c) return;
  c.width = c.offsetWidth || 320;
  c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#FFFFFE'; ctx.fillRect(0,0,c.width,c.height);
  const img = new Image();
  img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height);
  img.src = data.image_data;
}

function updateProgress() {
  const done = Object.keys(reviewMeta).length;
  const max = students.length * 5;
  document.getElementById('prog').textContent = `${done}/${max}`;
}

// ── TOAST ────────────────────────────────────────────────
let tT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(tT); tT = setTimeout(() => el.classList.remove('on'), 2400);
}
</script>
</body>
</html>
